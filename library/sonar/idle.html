<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sonar — All Quiet — 404STARTUP</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
html,body{height:100%;margin:0;background:#04101A;overflow:hidden}
body{font-family:ui-monospace,Menlo,Consolas,monospace;color:#9FE8DC;-webkit-user-select:none;user-select:none}
canvas{position:fixed;top:0;left:0;display:block}
.scan{position:fixed;inset:0;pointer-events:none;z-index:3;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);opacity:.4}
.back{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:5;color:#9FE8DC;text-decoration:none;
 border:1px solid #2E6B63;padding:9px 13px;font-size:11px;letter-spacing:.14em;background:rgba(4,16,26,.7)}
.back:hover{border-color:#5CF2D6}
.hud{position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;z-index:5;text-align:right;
 font-size:10px;letter-spacing:.22em;opacity:.75;line-height:1.9}
.big{position:fixed;left:50%;transform:translate(-50%,0);z-index:5;font-size:clamp(13px,2.4vw,20px);
 letter-spacing:.42em;opacity:.5;pointer-events:none;animation:pl 3s ease-in-out infinite}
@keyframes pl{50%{opacity:.15}}
.tag{position:fixed;left:50%;transform:translate(-50%,0);z-index:5;font-size:9.5px;letter-spacing:.3em;
 opacity:.4;width:94vw;text-align:center;white-space:nowrap}
</style></head><body>
<canvas id="c"></canvas><div class="scan"></div>
<a class="back" href="../">&#8592; SONAR CONTACT</a>
<div class="hud" id="hud">SONAR // PASSIVE<br><span id="clk">--:--:--</span> UTC<br>CONTACTS: 0</div>
<div class="big" id="big">ALL QUIET</div>
<div class="tag" id="tag">WAITING ROOM · TAP THE WATER TO PING · DEPTH 4,200 M</div>
<script>
var c=document.getElementById('c'),x=c.getContext('2d');
var W=0,H=0,cx=0,cy=0,R=0,sweep=0,t=0,found=0,blips=[],rip=[];
function measure(){
 var vv=window.visualViewport,de=document.documentElement;
 W=Math.min(vv?vv.width:innerWidth,de.clientWidth||innerWidth);
 H=Math.min(vv?vv.height:innerHeight,de.clientHeight||innerHeight);
 W=Math.max(200,Math.round(W));H=Math.max(240,Math.round(H));
 var D=Math.min(devicePixelRatio||1,2);
 c.width=W*D;c.height=H*D;c.style.width=W+'px';c.style.height=H+'px';
 x.setTransform(D,0,0,D,0,0);
 cx=W/2;cy=H*0.47;R=Math.min(W,H)*0.34;
 document.getElementById('big').style.top=Math.round(H*0.84)+'px';
 document.getElementById('tag').style.top=Math.round(H-26)+'px';
}
addEventListener('resize',measure);
if(window.visualViewport){visualViewport.addEventListener('resize',measure);visualViewport.addEventListener('scroll',measure);}
addEventListener('orientationchange',function(){setTimeout(measure,150);});
setInterval(measure,500);
measure();
function spawn(){var a=Math.random()*6.2832;
 blips.push({a:a,r:R*(.2+Math.random()*.72),ping:false,life:0});}
setInterval(function(){if(blips.length<5&&Math.random()<.7)spawn();},1500);
setInterval(function(){var d=new Date();
 document.getElementById('clk').textContent=('0'+d.getUTCHours()).slice(-2)+':'+('0'+d.getUTCMinutes()).slice(-2)+':'+('0'+d.getUTCSeconds()).slice(-2);},500);
addEventListener('pointerdown',function(e){rip.push({x:e.clientX,y:e.clientY,t:0});});
var last=performance.now(),raf=null;
function frame(now){var dt=Math.min((now-last)/1000,.05);last=now;t+=dt;
 sweep=(sweep+dt*.9)%6.2832;
 x.fillStyle='#04101A';x.fillRect(0,0,W,H);
 x.save();x.translate(cx,cy);
 x.strokeStyle='rgba(92,242,214,.14)';x.lineWidth=1.5;
 for(var i=1;i<=4;i++){x.beginPath();x.arc(0,0,R*i/4,0,6.2832);x.stroke();}
 x.strokeStyle='rgba(92,242,214,.07)';
 x.beginPath();x.moveTo(-R,0);x.lineTo(R,0);x.moveTo(0,-R);x.lineTo(0,R);x.stroke();
 for(var i=0;i<26;i++){var a=sweep-i*.02;
  x.strokeStyle='rgba(92,242,214,'+(.32*(1-i/26)).toFixed(3)+')';x.lineWidth=i?2:3;
  x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*R,Math.sin(a)*R);x.stroke();}
 for(var i=blips.length-1;i>=0;i--){var b=blips[i];
  var da=Math.abs((((sweep-b.a)%6.2832)+6.2832)%6.2832);
  if(da<.07||da>6.2832-.07){
   if(!b.ping){b.ping=true;b.life=1;found++;}
   else b.life-=dt*.22;}
  if(b.ping&&b.life>0){var bx=Math.cos(b.a)*b.r,by=Math.sin(b.a)*b.r;
   x.globalAlpha=Math.max(b.life,.12);x.fillStyle='#5CF2D6';
   x.beginPath();x.arc(bx,by,4.5,0,6.2832);x.fill();
   x.strokeStyle='#5CF2D6';x.globalAlpha=Math.max(b.life,.1)*.5;
   x.beginPath();x.arc(bx,by,4.5+(1-b.life)*14,0,6.2832);x.stroke();
   x.globalAlpha=1;}
  if(b.ping&&b.life<=0)blips.splice(i,1);}
 x.fillStyle='#5CF2D6';x.beginPath();x.arc(0,0,3.5,0,6.2832);x.fill();
 x.restore();
 for(var i=0;i<rip.length;i++){var r=rip[i];r.t+=dt;
  x.globalAlpha=1-r.t/.6;x.strokeStyle='rgba(92,242,214,.5)';
  x.beginPath();x.arc(r.x,r.y,6+r.t*90,0,6.2832);x.stroke();x.globalAlpha=1;}
 rip=rip.filter(function(r){return r.t<.6;});
 document.getElementById('hud').innerHTML='SONAR // PASSIVE<br>'+document.getElementById('clk').textContent+' UTC<br>CONTACTS: '+found;
 raf=requestAnimationFrame(frame);}
raf=requestAnimationFrame(frame);
document.addEventListener('visibilitychange',function(){
 if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=null;}
 else if(!raf){last=performance.now();raf=requestAnimationFrame(frame);}});
</script></body></html>
