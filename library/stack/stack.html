<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PAGE STACK — 404STARTUP</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
html,body{height:100%;margin:0;background:#12081F;overflow:hidden}
body{font-family:ui-monospace,Menlo,Consolas,monospace;color:#FFE8FB;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;top:0;left:0;display:block;touch-action:none}
.hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:10px;
 padding:max(14px,env(safe-area-inset-top)) 16px 8px;pointer-events:none}
.hud a{pointer-events:auto;color:#FFE8FB;text-decoration:none;border:1.5px solid rgba(255,232,251,.35);
 padding:8px 11px;font-size:11px;letter-spacing:.12em}
.hud .sp{flex:1}
.chip{font-size:10px;letter-spacing:.14em;opacity:.65}
.chip b{font-size:12px;opacity:1;min-width:6ch;display:inline-block;text-align:right}
.title{position:fixed;top:3.6rem;left:50%;transform:translateX(-50%);z-index:9;
 font-size:11px;font-weight:700;letter-spacing:.3em;color:#FF8AD8;pointer-events:none}
.hint{position:fixed;top:5.4rem;left:50%;transform:translateX(-50%);z-index:9;
 font-size:9.5px;letter-spacing:.2em;opacity:.6;animation:hb 1.6s steps(1) infinite;pointer-events:none}
@keyframes hb{50%{opacity:.2}}
.panel{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:20;text-align:center;
 background:#1A0F2E;border:2px solid #FFE8FB;padding:22px 30px;display:none;max-width:88vw}
.panel.show{display:block}
.panel .l{font-size:15px;font-weight:800;letter-spacing:.16em;color:#FF8AD8}
.panel .s{margin-top:10px;font-size:11px;letter-spacing:.14em;opacity:.85}
.panel .n{margin-top:8px;font-size:10px;letter-spacing:.26em;color:#FF8AD8;display:none}
.panel .n.show{display:block;animation:hb .9s steps(1) infinite}
.panel .r{margin-top:16px;font-size:11px;letter-spacing:.18em;animation:hb 1.3s steps(1) infinite}
.panel a{display:inline-block;margin-top:12px;font-size:10px;letter-spacing:.12em;color:#FF8AD8}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud">
 <a href="../">&#8592; LIBRARY</a>
 <span class="sp"></span>
 <span class="chip">SCORE <b id="sc">000000</b></span>
 <span class="chip">BEST <b id="bs">000000</b></span>
</div>
<div class="title">PAGE STACK</div>
<div class="hint" id="hint">TAP TO DROP THE FALLING PAGE</div>
<div class="panel" id="panel">
 <div class="l">TOWER COLLAPSED</div>
 <div class="s" id="ps"></div>
 <div class="n" id="pn">— NEW BEST —</div>
 <div class="r">TAP TO STACK AGAIN</div>
 <a href="stack_page.html">ABOUT THIS GAME →</a>
</div>
<script>
(function(){
document.addEventListener('gesturestart',function(e){e.preventDefault()});
document.addEventListener('gesturechange',function(e){e.preventDefault()});
var cv=document.getElementById('c'),x=cv.getContext('2d');
var scEl=document.getElementById('sc'),bsEl=document.getElementById('bs'),
    hintEl=document.getElementById('hint'),panel=document.getElementById('panel'),
    psEl=document.getElementById('ps'),pnEl=document.getElementById('pn');
var MONO='ui-monospace,Menlo,Consolas,monospace';
var W=0,H=0,U=1,BW=0,BH=0,baseY=0;
var layers=[],cur=null,shards=[],texts=[];
var score=0,combo=0,mode='ready',deadAt=0,shake=0,t=0,camY=0;
var best=+(localStorage.getItem('n404_best_stack')||0);
bsEl.textContent=pad(best);
function pad(n){n=Math.max(0,Math.floor(n));var s=String(n);while(s.length<6)s='0'+s;return s;}
function rand(a,b){return a+Math.random()*(b-a);}
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,k){var A=hex(a),B=hex(b);
 return 'rgb('+A.map(function(v,i){return Math.round(v+(B[i]-v)*k)}).join(',')+')';}
function layerColor(i){return mix('#FF8AD8','#3A1D5E',(i%10)/10*0.85);}
function measure(){
 var vv=window.visualViewport,de=document.documentElement;
 W=Math.min(vv?vv.width:innerWidth,de.clientWidth||innerWidth);
 H=Math.min(vv?vv.height:innerHeight,de.clientHeight||innerHeight);
 W=Math.max(200,Math.round(W));H=Math.max(240,Math.round(H));

 if(measure.lw===W&&measure.lh===H)return;
 measure.lw=W;measure.lh=H;
 var D=Math.min(devicePixelRatio||1,2);
 cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';
 x.setTransform(D,0,0,D,0,0);
 U=Math.max(.55,Math.min(H/560,W/470,1.4));
 BW=Math.min(W*.62,300*U);BH=Math.max(16,26*U);baseY=Math.round(H*.8);
}
addEventListener('resize',measure);
if(window.visualViewport)visualViewport.addEventListener('resize',measure);
addEventListener('orientationchange',function(){setTimeout(function(){measure();if(mode==='playing')toReady();},160);});
setInterval(measure,500);
measure();
var AC=null;
function tone(f0,f1,dur,type,vol){
 try{
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  var T=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f0,T);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),T+dur);
  g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(vol||.3,T+.012);
  g.gain.exponentialRampToValueAtTime(.0001,T+dur);
  o.connect(g);g.connect(AC.destination);o.start(T);o.stop(T+dur+.05);
 }catch(e){}
}
function toReady(){
 mode='ready';score=0;combo=0;layers=[{x:W/2,w:BW}];cur=null;shards=[];texts=[];camY=0;
 scEl.textContent=pad(0);panel.classList.remove('show');hintEl.style.display='';
}
function start(){
 mode='playing';hintEl.style.display='none';panel.classList.remove('show');
 newMover();tone(300,520,.12,'square',.28);
}
function newMover(){
 var tp=layers[layers.length-1];
 var left=Math.random()<.5;
 cur={w:tp.w,x:left?-tp.w/2:W+tp.w/2,dir:left?1:-1,v:Math.min(620,(180+score*7))*U};
}
function levelY(i){return baseY-i*BH+camY;}
function addText(x0,y0,s){texts.push({x:x0,y:y0,s:s,life:1});}
function drop(){
 if(!cur)return;
 var tp=layers[layers.length-1];
 var l=Math.max(cur.x-cur.w/2,tp.x-tp.w/2),r=Math.min(cur.x+cur.w/2,tp.x+tp.w/2);
 var ow=r-l;
 if(ow<=4*U){
  shards.push({x:cur.x,y:levelY(layers.length),w:cur.w,vy:-60,vr:rand(-6,6),rot:0});
  cur=null;die();return;
 }
 var perfect=Math.abs(cur.x-tp.x)<7*U,nw,nx;
 if(perfect){
  combo++;nw=Math.min(BW,tp.w+5*U);nx=tp.x;
  score+=10*combo;tone(660,990,.09,'square',.35);tone(990,1320,.12,'square',.3);
  addText(nx,levelY(layers.length)-BH,'PERFECT x'+combo);
 }else{
  combo=0;nw=ow;nx=(l+r)/2;
  var cutW=cur.w-ow,cutX=cur.x<tp.x?l-cutW/2:r+cutW/2;
  shards.push({x:cutX,y:levelY(layers.length),w:cutW,vy:-40,vr:rand(2,6)*(cur.x<tp.x?-1:1),rot:0});
  score+=10;tone(420,300,.07,'square',.3);
 }
 layers.push({x:nx,w:nw});
 scEl.textContent=pad(score);
 newMover();
}
function die(){
 mode='dead';deadAt=Date.now();shake=10;tone(380,55,.45,'sawtooth',.45);
 var nb=score>best;best=Math.max(best,score);
 localStorage.setItem('n404_best_stack',best);bsEl.textContent=pad(best);
 psEl.textContent='HEIGHT '+layers.length+' · SCORE '+pad(score);
 pnEl.classList.toggle('show',nb);
 setTimeout(function(){panel.classList.add('show');},450);
}
function act(){
 if(mode==='ready')start();
 else if(mode==='playing')drop();
 else if(mode==='dead'&&Date.now()-deadAt>450){toReady();start();}
}
addEventListener('keydown',function(e){
 if(e.key===' '||e.key==='Enter'){e.preventDefault();act();}});
cv.addEventListener('pointerdown',function(e){e.preventDefault();act();});
panel.addEventListener('pointerdown',function(e){e.stopPropagation();act();});
var last=performance.now(),raf=null;
function loop(now){
 raf=requestAnimationFrame(loop);
 var dt=Math.min((now-last)/1000,.05);last=now;t+=dt;
 shake=Math.max(0,shake-dt*26);
 if(mode==='playing'&&cur){
  cur.x+=cur.dir*cur.v*dt;
  var half=cur.w/2+6*U;
  if(cur.x>W+half){cur.x=W+half;cur.dir=-1;}
  if(cur.x<-half){cur.x=-half;cur.dir=1;}
 }
 var ty=Math.max(0,(layers.length-1)*BH-(baseY-H*.45));
 camY+=(ty-camY)*Math.min(1,dt*4);
 for(var i=shards.length-1;i>=0;i--){var s=shards[i];
  s.vy+=1400*U*dt;s.y+=s.vy*dt;s.rot+=s.vr*dt;
  if(s.y>H+120)shards.splice(i,1);}
 for(var i=texts.length-1;i>=0;i--){var f=texts[i];
  f.life-=dt*1.4;f.y-=34*U*dt;if(f.life<=0)texts.splice(i,1);}
 draw();
}
function draw(){
 x.fillStyle='#12081F';x.fillRect(0,0,W,H);
 x.fillStyle='rgba(255,138,216,.05)';x.fillRect(0,H*.45,W,H*.55);
 x.save();
 if(shake>0)x.translate(rand(-shake,shake),rand(-shake,shake));
 var first=Math.max(0,layers.length-Math.ceil(H/BH)-2);
 for(var i=first;i<layers.length;i++){
  var L=layers[i],y=levelY(i);
  if(y<-BH||y>H+BH)continue;
  x.fillStyle=layerColor(i);
  x.fillRect(L.x-L.w/2,y-BH,L.w,BH-2);
  x.fillStyle='rgba(255,255,255,.22)';
  x.fillRect(L.x-L.w/2,y-BH,L.w,3);
 }
 if(cur&&mode==='playing'){
  var y2=levelY(layers.length);
  x.fillStyle=layerColor(layers.length);
  x.fillRect(cur.x-cur.w/2,y2-BH,cur.w,BH-2);
  x.fillStyle='rgba(255,255,255,.4)';
  x.fillRect(cur.x-cur.w/2,y2-BH,cur.w,3);
 }
 for(var i=0;i<shards.length;i++){var s=shards[i];
  x.save();x.translate(s.x,s.y);x.rotate(s.rot);
  x.globalAlpha=.8;x.fillStyle=layerColor(layers.length);
  x.fillRect(-s.w/2,-BH/2,s.w,BH-2);x.globalAlpha=1;x.restore();}
 x.font='700 '+Math.round(12*U+4)+'px '+MONO;x.textAlign='right';
 x.fillStyle='rgba(255,232,251,.5)';
 x.fillText('HEIGHT '+layers.length,W-14,Math.round(H*.16));
 for(var i=0;i<texts.length;i++){var f=texts[i];
  x.globalAlpha=Math.max(f.life,0);x.textAlign='center';
  x.fillStyle='#FF8AD8';x.font='700 '+Math.round(11*U+3)+'px '+MONO;
  x.fillText(f.s,f.x,f.y);x.globalAlpha=1;}
 x.restore();
}
document.addEventListener('visibilitychange',function(){
 if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=null;}
 else if(!raf){last=performance.now();raf=requestAnimationFrame(loop);}});
toReady();
raf=requestAnimationFrame(function(t0){last=t0;raf=requestAnimationFrame(loop);});
})();
</script></body></html>
