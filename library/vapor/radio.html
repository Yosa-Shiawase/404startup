<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Sunset FM - Waiting Room - 404STARTUP</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
html,body{height:100%;margin:0;background:#160B33;overflow:hidden}
body{font-family:ui-monospace,Menlo,Consolas,monospace;color:#FFE8FB;
 -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;top:0;left:0;display:block;touch-action:none}
.scan{position:fixed;inset:0;pointer-events:none;z-index:3;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);opacity:.5}
.scan::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 22vmin rgba(0,0,0,.55)}
.back{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:5;color:#FFE8FB;text-decoration:none;
 border:1px solid rgba(255,232,251,.35);padding:9px 13px;font-size:11px;letter-spacing:.14em;background:rgba(22,11,51,.7)}
.back:hover{border-color:#FF71CE}
.stn{position:fixed;left:50%;transform:translateX(-50%);bottom:max(46px,env(safe-area-inset-bottom));z-index:5;text-align:center;pointer-events:none;width:94vw;transition:opacity .15s}
.stn.tuning{opacity:.35}
.stn .f{font-size:clamp(22px,5vw,40px);font-weight:800;letter-spacing:.08em;color:#FF8AD8;
 text-shadow:0 0 18px rgba(255,138,216,.7)}
.stn .n{margin-top:4px;font-size:clamp(10px,1.8vw,13px);letter-spacing:.34em;opacity:.75}
.tag{position:fixed;left:50%;transform:translateX(-50%);z-index:5;font-size:9.5px;letter-spacing:.3em;
 opacity:.45;width:94vw;text-align:center;white-space:nowrap;animation:hb 1.6s steps(1) infinite}
@keyframes hb{50%{opacity:.15}}
</style></head><body>
<canvas id="c"></canvas><div class="scan"></div>
<a class="back" href="../">&#8592; SUNSET DRIFT</a>
<div class="stn" id="stn"><div class="f" id="freq">88.3 FM</div><div class="n" id="name">SUNDOWN FM</div></div>
<div class="tag" id="tag">WAITING ROOM &#183; TAP TO TUNE &#183; SIGNAL: OFFLINE</div>
<script>
(function(){
document.addEventListener('gesturestart',function(e){e.preventDefault()});
document.addEventListener('gesturechange',function(e){e.preventDefault()});
var cv=document.getElementById('c'),x=cv.getContext('2d');
var stnEl=document.getElementById('stn'),freqEl=document.getElementById('freq'),
    nameEl=document.getElementById('name'),tagEl=document.getElementById('tag');
var W=0,H=0,hor=0,t=0,si=0,tuning=0,dist=0;
var ST=[
 {f:'88.3 FM',n:'SUNDOWN FM',sky:['#2B0F4D','#7A1E5E'],sunA:'#FFB86B',sunB:'#FF71CE',mtn:'#0B051F',grid:'rgba(1,205,205,.5)'},
 {f:'94.7 FM',n:'CHROME DREAMS',sky:['#041F2E','#0E5E6E'],sunA:'#7FE8D6',sunB:'#01CDCD',mtn:'#02141F',grid:'rgba(255,176,0,.45)'},
 {f:'101.1 FM',n:'VHS MEMORY',sky:['#1A0533','#5E1E7A'],sunA:'#FF8AD8',sunB:'#B564E3',mtn:'#0D021F',grid:'rgba(255,138,216,.45)'},
 {f:'107.9 FM',n:'PALM STATIC',sky:['#33140A','#7A3E1E'],sunA:'#FFD28A',sunB:'#FF6B4D',mtn:'#1F0D05',grid:'rgba(126,232,214,.4)'}];
function measure(){
 if(measure.lw===W&&measure.lh===H)return;
 measure.lw=W;measure.lh=H;
 var vv=window.visualViewport,de=document.documentElement;
 W=Math.min(vv?vv.width:innerWidth,de.clientWidth||innerWidth);
 H=Math.min(vv?vv.height:innerHeight,de.clientHeight||innerHeight);
 W=Math.max(200,Math.round(W));H=Math.max(240,Math.round(H));
 var D=Math.min(devicePixelRatio||1,2);
 cv.width=W*D;cv.height=H*D;cv.style.width=W+'px';cv.style.height=H+'px';
 x.setTransform(D,0,0,D,0,0);
 hor=Math.round(H*.52);
 tagEl.style.top=Math.round(H-26)+'px';
}
addEventListener('resize',measure);
if(window.visualViewport){visualViewport.addEventListener('resize',measure);visualViewport.addEventListener('scroll',measure);}
addEventListener('orientationchange',function(){setTimeout(measure,150)});
setInterval(measure,500);
measure();
function tune(d){
 si=(si+d+ST.length)%ST.length;tuning=1;stnEl.classList.add('tuning');
 var s=ST[si];freqEl.textContent=s.f;nameEl.textContent=s.n;
 setTimeout(function(){tuning=0;stnEl.classList.remove('tuning');},260);
}
addEventListener('pointerdown',function(){tune(1);});
addEventListener('keydown',function(e){
 if(e.key===' '||e.key==='Enter'||e.key==='ArrowRight')tune(1);
 else if(e.key==='ArrowLeft')tune(-1);});
var last=performance.now(),raf=null;
function loop(now){
 raf=requestAnimationFrame(loop);
 var dt=Math.min((now-last)/1000,.05);last=now;t+=dt;
 var s=ST[si];
 var sky=x.createLinearGradient(0,0,0,hor);
 sky.addColorStop(0,s.sky[0]);sky.addColorStop(1,s.sky[1]);
 x.fillStyle=sky;x.fillRect(0,0,W,hor+1);
 var sr=Math.min(W,H)*.19,sx=W*.5,sy=hor-sr*.35;
 var sg=x.createLinearGradient(0,sy-sr,0,sy+sr);
 sg.addColorStop(0,s.sunA);sg.addColorStop(1,s.sunB);
 x.fillStyle=sg;x.beginPath();x.arc(sx,sy,sr,0,6.2832);x.fill();
 x.fillStyle=s.sky[1];
 for(var i=0;i<6;i++)x.fillRect(sx-sr,sy+sr*.05+i*sr*.15,sr*2,2+i*1.3);
 x.fillStyle=s.mtn;
 x.beginPath();x.moveTo(0,hor);x.lineTo(W*.1,hor-H*.1);x.lineTo(W*.22,hor);x.closePath();x.fill();
 x.beginPath();x.moveTo(W*.78,hor);x.lineTo(W*.9,hor-H*.12);x.lineTo(W,hor);x.closePath();x.fill();
 x.fillStyle='#0B051F';x.fillRect(0,hor,W,H-hor);
 dist+=dt*(60+10*Math.sin(t*.4));
 x.strokeStyle=s.grid;x.lineWidth=1.2;
 for(var j=0;j<12;j++){
  var zz=((j/12)+dist*.0006)%1,y=hor+(H-hor)*Math.pow(zz,2.4);
  x.globalAlpha=.1+.55*zz;
  x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();}
 x.globalAlpha=.3;
 for(var i=-9;i<=9;i++){x.beginPath();x.moveTo(W/2+i*W*.012,hor);x.lineTo(W/2+i*W*.16,H);x.stroke();}
 x.globalAlpha=1;
 if(tuning>0){
  x.fillStyle='rgba(255,232,251,'+(tuning*.25*Math.random()).toFixed(3)+')';
  for(var i=0;i<40;i++)x.fillRect(Math.random()*W,Math.random()*H,3,3);
 }
}
document.addEventListener('visibilitychange',function(){
 if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=null;}
 else if(!raf){last=performance.now();raf=requestAnimationFrame(loop);}});
raf=requestAnimationFrame(function(t0){last=t0;raf=requestAnimationFrame(loop);});
})();
</script></body></html>
