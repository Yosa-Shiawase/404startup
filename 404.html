        /* =====================================================================

        Games.terminal = (() => {
            const g = { mode: 'ready' };
            const C = { bg: '#050805', frame: '#2E7B45', dim: '#1E5B33', snake: '#49E36F', head: '#A9F5C4', food: '#49E36F', gold: '#F2D258' };
            let t = 0, cols = 26, rows = 11, cell = 20, ox = 0, oy = 0;
            let snake = [], dir = { x: 1, y: 0 }, queue = [], food = null, golden = false, goldT = 0, eaten = 0, score = 0, stepMs = 140, acc = 0, deadT = 0;
            let flecks = [], sw = null;

            function layout() {
                const titleB = titleEl ? titleEl.getBoundingClientRect().bottom : 90;
                const top = clamp(titleB + 6, 56, H * .38);
                /* extra room below the board when the touch D-pad is visible */
                const reserve = dpadOn ? 120 : 80;
                const availH = Math.max(90, H - top - reserve), availW = Math.max(130, W - 16);
                const portrait = H > W * 1.05;
                let nc = portrait ? 13 : 24, nr = portrait ? 15 : 10;
                cell = clamp(Math.floor(Math.min(availW / nc, availH / nr)), 6, 32);
                nc = clamp(Math.floor(availW / cell), 8, nc);
                nr = clamp(Math.floor(availH / cell), 6, nr);
                cols = nc; rows = nr;
                ox = Math.round((W - cols * cell) / 2);
                oy = Math.round(top + (availH - rows * cell) / 2);
            }
            function reset() {
                const cx = Math.floor(cols / 2), cy = Math.floor(rows / 2);
                snake = []; for (let i = 0; i < 4; i++)snake.push({ x: cx - i, y: cy });
                dir = { x: 1, y: 0 }; queue = []; eaten = 0; score = 0; stepMs = 140; golden = false; acc = 0;
                setScore(0); placeFood();
            }
            function resetDemo() {
                snake = []; const len = Math.min(8, cols - 2);
                for (let i = 0; i < len; i++)snake.push({ x: Math.max(len - 1 - i, 0), y: 0 });
                dir = { x: 1, y: 0 }; queue = []; food = null; golden = false; score = 0; setScore(0);
            }
            function start() {
                if (g.mode !== 'ready') return;
                reset(); g.mode = 'playing'; hideHint(); hideOver();
                AudioFX.tone(440, 660, .12, 'square', .4);
            }
            function placeFood() {
                let p;
                do { p = { x: irand(0, cols - 1), y: irand(0, rows - 1) }; } while (snake.some(s => s.x === p.x && s.y === p.y));
                food = p;
            }
            function demoStep() {
                if (dir.x === 1 && snake[0].x >= cols - 2) dir = { x: 0, y: 1 };
                else if (dir.y === 1 && snake[0].y >= rows - 2) dir = { x: -1, y: 0 };
                else if (dir.x === -1 && snake[0].x <= 1) dir = { x: 0, y: -1 };
                else if (dir.y === -1 && snake[0].y <= 1) dir = { x: 1, y: 0 };
                snake.unshift({ x: snake[0].x + dir.x, y: snake[0].y + dir.y });
                if (snake.length > Math.min(8, cols - 2)) snake.pop();
            }
            function step() {
                if (queue.length) dir = queue.shift();
                const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
                if (h.x < 0 || h.x >= cols || h.y < 0 || h.y >= rows || snake.some(s => s.x === h.x && s.y === h.y)) { die(); return; }
                snake.unshift(h);
                if (food && h.x === food.x && h.y === food.y) {
                    eaten++;
                    score += golden ? 30 : 10; setScore(score, true);
                    golden ? AudioFX.golden() : AudioFX.eat();
                    burstFleck(food.x, food.y, golden ? C.gold : C.food);
                    stepMs = Math.max(84, 140 - eaten * 3);
                    golden = (eaten % 5 === 0); if (golden) goldT = 7;
                    placeFood();
                } else snake.pop();
            }
            function die() {
                g.mode = 'dead'; deadAt = performance.now(); deadT = 0; AudioFX.die();
                const best = +LS.get(bestKey('terminal'), 0), nb = score > best, mx = Math.max(best, score);
                if (nb) LS.set(bestKey('terminal'), score);
                setBest(mx);
                setTimeout(() => showOver(THEMES.terminal.over, score, mx, nb), 550);
            }
            function burstFleck(cx, cy, col) {
                for (let i = 0; i < 9; i++)flecks.push({ x: ox + (cx + .5) * cell, y: oy + (cy + .5) * cell, vx: rand(-90, 90), vy: rand(-90, 90), life: rand(.25, .5), t: 0, col });
            }
            function pushDir(v) {
                const last = queue.length ? queue[queue.length - 1] : dir;
                if (v.x === -last.x && v.y === -last.y) return;
                if (v.x === last.x && v.y === last.y) return;
                if (queue.length < 3) queue.push(v);
            }

            g.enter = () => { layout(); resetDemo(); g.mode = 'ready'; hideOver(); };
            g.start = start;
            g.restart = () => { reset(); g.mode = 'playing'; hideHint(); hideOver(); AudioFX.eat(); };
            g.key = k => {
                const map = {
                    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
                    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0], W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
                };

                pushDir({ x: v[0], y: v[1] });

                if (type === 'down') sw = { x: e.clientX, y: e.clientY };

                    const th = Math.min(28, Math.max(20, W * .04));
                    if (Math.hypot(dx, dy) > th)
                        g.key(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ArrowRight' : 'ArrowLeft') : (dy > 0 ? 'ArrowDown' : 'ArrowUp'));
                }
            };
            g.resize = () => {
                const oc = cols, orr = rows;
                layout();
                if (g.mode === 'playing' && (oc !== cols || orr !== rows)) { resetDemo(); g.mode = 'ready'; }
                else if (g.mode === 'ready') resetDemo();
            };

            g.update = dt => {

                }
                for (const f of flecks) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; }
                flecks = flecks.filter(f => f.t < f.life);
            };

            g.draw = gc => {
                gc.fillStyle = C.bg; gc.fillRect(0, 0, W, H);
                const fx = ox - 14, fy = oy - 16, fw = cols * cell + 28, fh = rows * cell + 32;
                gc.strokeStyle = C.frame; gc.lineWidth = 1.5; gc.strokeRect(fx + .5, fy + .5, fw, fh);
                gc.strokeStyle = C.gold; gc.lineWidth = 3;
                const tk = 9;
                [[fx, fy, 1, 1], [fx + fw, fy, -1, 1], [fx, fy + fh, 1, -1], [fx + fw, fy + fh, -1, -1]].forEach(([x, y, sx, sy]) => {
                    gc.beginPath(); gc.moveTo(x + sx * tk, y); gc.lineTo(x, y); gc.lineTo(x, y + sy * tk); gc.stroke();
                });
                if (cell >= 10) {
                    gc.font = `16px ${MONO}`; gc.fillStyle = C.frame; gc.textBaseline = 'alphabetic';
                    gc.textAlign = 'left'; gc.fillText('MEM[0x404] :: SNAKE.SYS', fx, fy - 6);
                    gc.textAlign = 'right'; gc.fillText(g.mode === 'dead' ? '// SEGFAULT' : (golden ? '!! GOLDEN !!' : (g.mode === 'ready' ? '// ATTRACT' : '')), fx + fw, fy - 6);
                }
                gc.fillStyle = C.dim; gc.globalAlpha = .55;
                for (let i = 1; i < cols; i++)for (let j = 1; j < rows; j++)gc.fillRect(ox + i * cell - 1, oy + j * cell - 1, 1.6, 1.6);
                gc.globalAlpha = 1;
                if (food && g.mode !== 'ready') {
                    const blink = golden && goldT < 2 && (t * 8 % 1 > .45);
                    if (!blink) {
                        const r = cell * .3 * (1 + .15 * Math.sin(t * 7));
                        gc.fillStyle = golden ? C.gold : C.food;
                        gc.save(); gc.translate(ox + (food.x + .5) * cell, oy + (food.y + .5) * cell); gc.rotate(Math.PI / 4);
                        const s = r * .8; gc.fillRect(-s, -s, s * 2, s * 2); gc.restore();
                    }
                }
                const vis = g.mode !== 'dead' || Math.floor(deadT * 6) % 2 === 0;
                if (vis) {
                    for (let i = snake.length - 1; i >= 0; i--) {
                        const s = snake[i];
                        gc.globalAlpha = .45 + .55 * (1 - i / snake.length);
                        gc.fillStyle = i === 0 ? C.head : C.snake;
                        if (i === 0 && cell >= 9) { gc.shadowColor = C.snake; gc.shadowBlur = 10; }
                        gc.fillRect(ox + s.x * cell + 1.5, oy + s.y * cell + 1.5, cell - 3, cell - 3);
                        gc.shadowBlur = 0;
                    }
                    gc.globalAlpha = 1;
                    const h = snake[0];
                    const ex = ox + (h.x + .5) * cell, ey = oy + (h.y + .5) * cell;
                    const fxp = dir.x * cell * .14, fyp = dir.y * cell * .14;
                    const oxp = dir.y !== 0 ? cell * .16 : 0, oyp = dir.x !== 0 ? cell * .16 : 0;
                    gc.fillStyle = C.bg;
                    gc.fillRect(ex + fxp - oxp - 1.5, ey + fyp - oyp - 1.5, 3, 3);
                    gc.fillRect(ex + fxp + oxp - 1.5, ey + fyp + oyp - 1.5, 3, 3);
                }
                for (const f of flecks) { gc.globalAlpha = 1 - f.t / f.life; gc.fillStyle = f.col; gc.beginPath(); gc.arc(f.x, f.y, 2, 0, TAU); gc.fill(); }
                gc.globalAlpha = 1;
                if (g.mode === 'ready' && cell >= 10) {
                    gc.fillStyle = C.dim; gc.font = `16px ${MONO}`; gc.textAlign = 'center';
                    gc.fillText('> awaiting input _', ox + cols * cell / 2, oy + rows * cell / 2 + 5);
                }
            };
            return g;
        })();
/* =====================================================================
           input routing, sound / fullscreen, main loop, boot
           ===================================================================== */
        addEventListener('keydown', e => {
            const k = e.key;
            if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
            AudioFX.ensure();
            if (k === '1' || k === '2' || k === '3') { switchTheme(['dunes', 'orbit', 'terminal'][+k - 1]); return; }
            if (k === 'm' || k === 'M') { toggleMute(); return; }
            if (k === 'f' || k === 'F') { toggleFS(); return; }
            const gm = Games[cur];
            if (gm.mode === 'dead') { if ((k === ' ' || k === 'Enter') && performance.now() - deadAt > 450) gm.restart(); return; }
            if (gm.mode === 'ready') {
                const dirs = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D'];
                if (k === ' ' || k === 'Enter' || k === 'ArrowUp' || (cur === 'terminal' && dirs.includes(k))) {
                    gm.start(); if (cur === 'terminal' && dirs.includes(k)) gm.key(k);
                }
                return;
            }
            gm.key && gm.key(k);
        });
        addEventListener('keyup', e => {
            Games.dunes.release && Games.dunes.release(e.key);
            Games.orbit.release && Games.orbit.release();
        });

        cv.addEventListener('pointerdown', e => {
            AudioFX.ensure();
            const gm = Games[cur];
            if (gm.mode === 'dead') { if (performance.now() - deadAt > 450) gm.restart(); return; }
            if (gm.mode === 'ready') { gm.start(); return; }
            gm.pointer && gm.pointer(e, 'down');
        });
        addEventListener('pointermove', e => {
            const gm = Games[cur];
            if (gm.mode === 'playing') gm.pointer && gm.pointer(e, 'move');
        });
        addEventListener('pointerup', e => {
            const gm = Games[cur];
            gm.pointer && gm.pointer(e, 'up');
        });
        addEventListener('pointercancel', e => {
            const gm = Games[cur];
            gm.pointer && gm.pointer(e, 'up');
        });
        cv.addEventListener('contextmenu', e => e.preventDefault());
        els.over.addEventListener('pointerdown', e => {
            e.stopPropagation();
            if (Games[cur].mode === 'dead' && performance.now() - deadAt > 300) Games[cur].restart();
        });

        $('#switcher').querySelectorAll('button').forEach(b =>
            b.addEventListener('click', () => { switchTheme(b.dataset.t); b.blur(); }));

        dpad.querySelectorAll('button').forEach(b => {
            b.addEventListener('pointerdown', e => {
                e.preventDefault(); e.stopPropagation();
                AudioFX.ensure();
                const gm = Games[cur];
                if (gm.mode === 'ready') gm.start();
                else if (gm.mode === 'dead') { if (performance.now() - deadAt > 400) gm.restart(); return; }
                gm.key && gm.key(b.dataset.k);
            });
        });

        const icoOn = $('#icoOn'), icoOff = $('#icoOff');
        function renderMute() { icoOn.style.display = AudioFX.muted ? 'none' : ''; icoOff.style.display = AudioFX.muted ? '' : 'none'; }
        function toggleMute() { AudioFX.muted = !AudioFX.muted; LS.set('nf404_mute', AudioFX.muted ? '1' : '0'); renderMute(); }
        els.sound.addEventListener('click', () => { AudioFX.ensure(); toggleMute(); });

        const fsBtn = $('#fsBtn'), fsOn = $('#fsOn'), fsOff = $('#fsOff');
        const fsEl = document.documentElement;
        const canFS = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
        function renderFS() { const on = !!(document.fullscreenElement || document.webkitFullscreenElement); fsOn.style.display = on ? 'none' : ''; fsOff.style.display = on ? '' : 'none'; }
        function toggleFS() {
            if (!canFS) return;
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            } else {
                (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
            }
        }
        if (canFS) { fsBtn.addEventListener('click', toggleFS); document.addEventListener('fullscreenchange', renderFS); document.addEventListener('webkitfullscreenchange', renderFS); }
        else fsBtn.style.display = 'none';

        let rafId = null, last = performance.now();
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) { if (rafId) cancelAnimationFrame(rafId); rafId = null; }
            else if (!rafId) { last = performance.now(); rafId = requestAnimationFrame(frame); }
        });
        function frame(t) {
            const dt = Math.min((t - last) / 1000, .05); last = t;
            Games[cur].update(dt);
            Games[cur].draw(ctx);
            rafId = requestAnimationFrame(frame);
        }

        /* boot */
        renderMute();
        resize();
        const saved = LS.get('nf404_theme', 'dunes');
        applyTheme(THEMES[saved] ? saved : 'dunes');
        rafId = requestAnimationFrame(t => { last = t; rafId = requestAnimationFrame(frame); });
    </script>
</body>

</html>
