<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>QA Console - 404STARTUP</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-monospace,Menlo,Consolas,monospace;background:#F2E2C4;color:#2B1F12;min-height:100vh;transition:background-color .8s,color .8s}
body.orbit{background:#0A0E1B;color:#E9EDF6}
.wrap{max-width:980px;margin:0 auto;padding:0 20px 70px}
header{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:2px solid currentColor}
header b{letter-spacing:.22em;font-size:12px}
header .sp{flex:1}
.lnk{font-size:11px;letter-spacing:.12em;color:#C75B26;text-decoration:none;border:1.5px solid #C75B26;padding:8px 12px}
h1{font-size:clamp(26px,5vw,44px);margin:30px 0 4px}
.kick{font-size:10px;letter-spacing:.34em;color:#C75B26;margin-bottom:8px}
.lead{opacity:.7;font-size:13px;line-height:1.7;max-width:64ch}
h2{font-size:15px;letter-spacing:.14em;margin:30px 0 12px}
h2 span{color:#C75B26}
.sys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:20px}
.cell{border:2px solid currentColor;border-radius:6px;padding:12px}
.cell .k{font-size:9px;letter-spacing:.2em;opacity:.6}
.cell .v{font-size:13.5px;font-weight:700;margin-top:4px}
.v.ok{color:#0E8A5F}.v.warn{color:#D99000}.v.bad{color:#C0392B}
body.orbit .v.ok{color:#7FE8D6}
table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
th{text-align:left;font-size:9.5px;letter-spacing:.18em;opacity:.6;padding:8px 6px;border-bottom:2px solid currentColor}
td{padding:9px 6px;border-bottom:1px dashed rgba(128,128,128,.4);vertical-align:top}
td a{color:#C75B26}
.pill{display:inline-block;font-size:9.5px;letter-spacing:.1em;border:1px solid rgba(128,128,128,.5);border-radius:999px;padding:2px 8px;margin:1px;white-space:nowrap}
.pill.ok{color:#0E8A5F;border-color:#0E8A5F}
.pill.bad{color:#C0392B;border-color:#C0392B}
button.run{background:#C75B26;color:#fff;border:0;font-family:inherit;font-size:12px;letter-spacing:.14em;padding:12px 20px;border-radius:4px;cursor:pointer;margin-top:18px}
footer{border-top:2px solid currentColor;margin-top:50px;padding:20px 0;text-align:center;font-size:11px;opacity:.7}
footer a{color:#C75B26}
</style></head><body>
<div class="wrap">
<header>
<svg viewBox="0 0 32 32" width="30"><polygon points="8,6 13,12 8,13" fill="#C75B26"/><polygon points="24,6 19,12 24,13" fill="#C75B26"/><polygon points="8,12 24,12 16,24" fill="#C75B26"/><polygon points="12,17 20,17 16,22" fill="#3A2A18"/></svg>
<b>404STARTUP</b><span class="sp"></span>
<a class="lnk" href="index.html">&#8592; HOME</a>
<a class="lnk" href="/dashboard.html">DASHBOARD</a>
</header>
<div class="kick">// INTERNAL &#183; DO NOT INDEX</div>
<h1>QA CONSOLE</h1>
<p class="lead">One bookmark for regression nights: system health, every world's best score, and per-page cache/network checks from this device.</p>
<div class="sys" id="sys"></div>
<h2><span>//</span> GAMES (<span id="gcount">0</span>)</h2>
<table><thead><tr><th>WORLD</th><th>BEST</th><th>LINKS</th><th>CACHE / NET</th></tr></thead>
<tbody id="rows"></tbody></table>
<button class="run" id="rerun">RE-RUN CHECKS</button>
<h2><span>//</span> AMBIENT &amp; DEMO</h2>
<table><tbody id="xrows"></tbody></table>
</div>
<footer><a href="index.html">home</a> &#183; <a href="/dashboard.html">dashboard</a></footer>
<script src="/assets/library-manifest.js"></script>
<script src="/assets/nav.js"></script>
<script>
function best(id){return Math.max(+(localStorage.getItem('n404_best_'+id)||0),+(localStorage.getItem('nf404_best_'+id)||0));}
function pad(n){n=Math.max(0,Math.floor(n));var s=String(n);while(s.length<6)s='0'+s;return s;}
var SYS={};
function sysCell(k,v,cls){SYS[k]={v:v,cls:cls};}
function renderSys(){var h='';for(var k in SYS){var c=SYS[k];
 h+='<div class="cell"><div class="k">'+k+'</div><div class="v '+(c.cls||'')+'">'+c.v+'</div></div>';}
 document.getElementById('sys').innerHTML=h;}
sysCell('MODE',navigator.onLine?'ONLINE':'OFFLINE',navigator.onLine?'ok':'warn');
var swc=(navigator.serviceWorker&&navigator.serviceWorker.controller)?'ACTIVE':'NOT CONTROLLING';
sysCell('SERVICE WORKER',swc,swc==='ACTIVE'?'ok':'warn');
try{localStorage.setItem('n404_qa','1');localStorage.removeItem('n404_qa');sysCell('LOCALSTORAGE','OK','ok');}
catch(e){sysCell('LOCALSTORAGE','BLOCKED','bad');}
try{var tc=document.createElement('canvas').getContext('2d');sysCell('CANVAS',tc?'OK':'FAIL',tc?'ok':'bad');}
catch(e){sysCell('CANVAS','FAIL','bad');}
var AC=window.AudioContext||window.webkitAudioContext;
sysCell('AUDIO',AC?'READY':'UNSUPPORTED',AC?'ok':'warn');
renderSys();
if(window.caches){caches.keys().then(function(ks){
 var k=null;for(var i=0;i<ks.length;i++)if(/^n404-v/.test(ks[i]))k=ks[i];
 if(!k){sysCell('CACHE','NONE','bad');renderSys();return;}
 caches.open(k).then(function(c){return c.keys();}).then(function(reqs){
  sysCell('CACHE',k+' \u00b7 '+reqs.length+' ENTRIES','ok');renderSys();});
}).catch(function(){sysCell('CACHE','ERROR','bad');renderSys();});}
else sysCell('CACHE','UNSUPPORTED','warn');
document.getElementById('rows').innerHTML=N404_GAMES.map(function(g){
 var b=best(g.id);
 return '<tr><td><b>'+g.num+'</b> '+g.title+'</td>'+
 '<td>'+(b?pad(b):'<span style="opacity:.5">------</span>')+'</td>'+
 '<td><a href="'+g.dir+'/'+g.dir+'.html">PLAY</a> \u00b7 <a href="'+g.dir+'/'+g.dir+'_page.html">PAGE</a></td>'+
 '<td data-u="/library/'+g.dir+'/'+g.dir+'.html"><span class="pill">...</span></td></tr>';}).join('');
document.getElementById('gcount').textContent=N404_GAMES.length;
var EXTRA=[['MATRIX RAIN','/library/matrix/rain.html'],['SONAR SWEEP','/library/sonar/idle.html'],
 ['SUNSET FM','/library/vapor/radio.html'],['NIRAKSHAN DEMO','/work/nirakshan/demo.html']];
document.getElementById('xrows').innerHTML=EXTRA.map(function(x){
 return '<tr><td><b>'+x[0]+'</b></td><td><a href="'+x[1]+'">OPEN</a></td>'+
 '<td data-u="'+x[1]+'"><span class="pill">...</span></td></tr>';}).join('');
function checkCell(url,cell){
 caches.match(url).then(function(hit){
  var c=hit?'CACHED':'NOT CACHED';
  return fetch(url,{cache:'no-store'}).then(function(r){
   cell.innerHTML='<span class="pill '+(r.ok?'ok':'bad')+'">'+c+' \u00b7 NET '+r.status+'</span>';
  }).catch(function(){
   cell.innerHTML='<span class="pill '+(hit?'ok':'bad')+'">'+c+' \u00b7 NET DOWN</span>';});
 }).catch(function(){cell.innerHTML='<span class="pill bad">ERR</span>';});}
function runAll(){
 var cells=document.querySelectorAll('td[data-u]');
 for(var i=0;i<cells.length;i++){var u=cells[i].getAttribute('data-u');
  if(window.caches)checkCell(u,cells[i]);
  else (function(cl){fetch(u,{cache:'no-store'}).then(function(r){
   cl.innerHTML='<span class="pill '+(r.ok?'ok':'bad')+'">NET '+r.status+'</span>';
  }).catch(function(){cl.innerHTML='<span class="pill bad">NET DOWN</span>';});})(cells[i]);}
}
document.getElementById('rerun').addEventListener('click',runAll);
runAll();
</script>
</body></html>
